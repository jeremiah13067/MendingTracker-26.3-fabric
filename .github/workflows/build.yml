name: build
on: [pull_request, push]
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit tests, and package validation
        shell: bash
        run: ./gradlew clean build prepareRelease --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: build/release/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: build/reports/

  client-tests:
    strategy:
      fail-fast: false
      matrix:
        optional-mods: [none, modmenu, malilib, minihud, all]
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Install virtual display and software rendering
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 libflite1
      - name: Test packaged mod in a production Fabric client
        run: xvfb-run -a ./gradlew productionClientRestartTest -PoptionalMods=${{ matrix.optional-mods }} --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-tests-${{ matrix.optional-mods }}
          path: |
            build/run/production-*/logs/
            build/run/production-*/screenshots/
            build/run/production-*/crash-reports/
