plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
def releaseVersion = version.toString()
def modProjectName = project.name

repositories {
    // Required transitively by MaLiLib and MiniHUD's conditional mixins.
    maven {
        url = 'https://maven.fallenbreath.me/releases'
        content { includeGroup('me.fallenbreath') }
    }
    maven {
        url = 'https://masa.dy.fi/maven/sakura-ryoko'
        content { includeGroupAndSubgroups('fi.dy.masa') }
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
        content { includeGroup('com.terraformersmc') }
    }
}

def optionalMods = providers.gradleProperty('optionalMods').getOrElse('none')
if (!(optionalMods in ['none', 'modmenu', 'malilib', 'minihud', 'all'])) {
    throw new GradleException("Unknown optionalMods profile: ${optionalMods}")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"
    compileOnly "fi.dy.masa.minihud:minihud-fabric-${project.minecraft_version}:${project.minihud_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    if (optionalMods in ['malilib', 'minihud', 'all']) {
        localRuntime "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"
    }
    if (optionalMods in ['minihud', 'all']) {
        localRuntime "fi.dy.masa.minihud:minihud-fabric-${project.minecraft_version}:${project.minihud_version}"
    }
    if (optionalMods in ['modmenu', 'all']) {
        localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
    }

    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', releaseVersion
    filesMatching('fabric.mod.json') { expand 'version': releaseVersion }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

test { useJUnitPlatform() }

fabricApi.configureTests {
    createSourceSet = true
    modId = 'mending-tracker-test'
    enableGameTests = false
    enableClientGameTests = true
}

loom.runConfigs.named('clientGameTest') {
    systemProperties.put('mendingtracker.test.profile', optionalMods)
}

configurations.productionRuntimeMods.extendsFrom(configurations.localRuntime)

tasks.register('gametestJar', Jar) {
    archiveClassifier = 'gametest'
    from sourceSets.gametest.output
}

tasks.register('productionClientTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    group = 'verification'
    description = 'Runs integration tests against the packaged mod with development mode disabled.'
    mods.from(tasks.named('gametestJar'))
    runDir = layout.buildDirectory.dir("run/production-${optionalMods}")
    jvmArgs.addAll('-Dfabric.client.gametest', '-Dmendingtracker.test.packaged=true', "-Dmendingtracker.test.profile=${optionalMods}")
    programArgs.addAll('--username', 'Player0')
    if (providers.gradleProperty('graphicsBackend').isPresent()) {
        programArgs.addAll('--graphicsBackend', providers.gradleProperty('graphicsBackend').get())
    }
    timeout = java.time.Duration.ofMinutes(10)
    doFirst {
        def directory = runDir.get().asFile.canonicalFile
        def expected = layout.buildDirectory.dir("run/production-${optionalMods}").get().asFile.canonicalFile
        if (directory != expected || !directory.toPath().startsWith(layout.buildDirectory.get().asFile.canonicalFile.toPath())) {
            throw new GradleException('Refusing to clear a production test directory outside build/')
        }
        delete directory
    }
}

tasks.register('productionClientRestartTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    group = 'verification'
    description = 'Restarts the packaged MiniHUD client and verifies persisted integration settings.'
    dependsOn tasks.named('productionClientTest')
    onlyIf { optionalMods in ['minihud', 'all'] }
    mods.from(tasks.named('gametestJar'))
    runDir = layout.buildDirectory.dir("run/production-${optionalMods}")
    jvmArgs.addAll('-Dfabric.client.gametest', '-Dmendingtracker.test.packaged=true',
            '-Dmendingtracker.test.restart=true', "-Dmendingtracker.test.profile=${optionalMods}")
    programArgs.addAll('--username', 'Player0')
    if (providers.gradleProperty('graphicsBackend').isPresent()) {
        programArgs.addAll('--graphicsBackend', providers.gradleProperty('graphicsBackend').get())
    }
    timeout = java.time.Duration.ofMinutes(10)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar { from('LICENSE') { rename { "${it}_${modProjectName}" } } }
tasks.named('sourcesJar') { from('LICENSE') { rename { "${it}_${modProjectName}" } } }

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
}

tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doLast {
        def archive = tasks.jar.archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            assert metadata.version == releaseVersion
            assert metadata.depends.minecraft == '>=26.3 <26.4'
            assert metadata.environment == 'client'
            ['mendingtracker.mixins.json', 'assets/mending-tracker/icon.png',
             'assets/mending-tracker/lang/en_us.json', "LICENSE_${modProjectName}"].each {
                assert zip.getEntry(it) != null : "Missing release resource: ${it}"
            }
            assert !zip.entries().toList().any { it.name.contains('ClientTest') || it.name.contains('MiniHudChecks') || it.name.startsWith('META-INF/jars/') }
        }
    }
}

check.dependsOn tasks.named('verifyReleaseJar')

tasks.register('prepareRelease') {
    group = 'distribution'
    description = 'Collects binary/source JARs, release documentation and SHA-256 checksums.'
    dependsOn tasks.named('build')
    doLast {
        def releaseDir = layout.buildDirectory.dir('release').get().asFile
        copy {
            into releaseDir
            from tasks.jar.archiveFile
            from tasks.sourcesJar.archiveFile
            from 'RELEASE_NOTES.md', 'CHANGELOG.md', 'VALIDATION.md', 'LICENSE'
        }
        def sums = [tasks.jar.archiveFile.get().asFile, tasks.sourcesJar.archiveFile.get().asFile].collect { file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex()
            "${digest}  ${file.name}"
        }
        new File(releaseDir, 'SHA256SUMS').setText(sums.join('\n') + '\n', 'UTF-8')
    }
}
